name: Validate scene

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scene
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ImageMagick and pinned Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick xz-utils
          archive="$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz
          echo "95e3a2dfedba3bd32ca54fc355eac6b15a11986954ccb02815a07535d0120a25  $archive" | sha256sum --check
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP"
          blender="$RUNNER_TEMP/blender-4.5.12-linux-x64/blender"
          echo "33ac108ebce3c271f5357e5c664d0488717263bcf2145c80300edd0b12c31880  $blender" | sha256sum --check
          echo "BLENDER_BIN=$blender" >> "$GITHUB_ENV"

      - name: Install scene dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject changes to immutable versioned artifacts
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "immutable_baseline_missing" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_paths="$RUNNER_TEMP/scene-changed-paths.txt"
          if ! git diff --no-renames --name-only "$BASE_SHA" HEAD -- assets/scenes provenance source 'source/baked-review-lightmap-*.png' > "$changed_paths"; then
            echo "immutable_diff_failed" >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              assets/scenes/*/*/*) protected_path="$(cut -d/ -f1-4 <<< "$path")" ;;
              source/releases/*/*) protected_path="$(cut -d/ -f1-3 <<< "$path")" ;;
              provenance/releases/*/*) protected_path="$(cut -d/ -f1-3 <<< "$path")" ;;
              provenance/runtime-capture-*/*) protected_path="$(cut -d/ -f1-2 <<< "$path")" ;;
              provenance/baked-lightmap-*.json|source/baked-review-lightmap-*.png) protected_path="$path" ;;
              source/review/*) protected_path="source/review" ;;
              source/review-candidate-lock.json|source/metadata-release-lock.json) protected_path="$path" ;;
              source/release-acceptance-index.json) continue ;;
              source/*|provenance/*) protected_path="$path" ;;
              *) continue ;;
            esac
            if ! baseline_path="$(git ls-tree --name-only "$BASE_SHA" -- "$protected_path")"; then
              echo "immutable_baseline_query_failed:$path" >&2
              exit 1
            fi
            if [[ -n "$baseline_path" ]]; then
              echo "immutable_versioned_artifact_changed:$path" >&2
              exit 1
            fi
          done < "$changed_paths"
          BASE="$BASE_SHA" node scripts/validate-acceptance-index-prefix.mjs

      - name: Validate committed visual evidence
        run: pnpm validate:visual

      - name: Run scene unit tests
        run: pnpm test

      - name: Validate repository and review release
        run: pnpm validate

      - name: Inspect GLB release
        run: pnpm inspect

      - name: Verify actual two-run Blender reproducibility
        run: pnpm verify:reproducibility

      - name: Read platform validator lock
        id: platform-ref
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < platform-validator.lock)"
          repository_sha="$(node -e 'process.stdout.write(require("./scene-repository.json").platformValidatorCommit)')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$sha" != "$repository_sha" ]]; then
            echo "invalid_platform_validator_lock" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned platform validator
        uses: actions/checkout@v4
        with:
          repository: vrata-labs/platform
          ref: ${{ steps.platform-ref.outputs.sha }}
          path: .platform

      - name: Verify bound runtime capture harness patch
        working-directory: .platform
        shell: bash
        run: |
          patch="../source/releases/0.3.0/capture-harness.patch"
          harness="tests/e2e/scene-visual.spec.ts"
          echo "73b3aa74ad47b18265056e6451b8d0ac4aa536748153827b2cfa669e37aef5ce  $patch" | sha256sum --check
          echo "245fc21b8c82a904db9eb5f037235fcabda7eb7bd7022b8d386c1b1b3b9e4b78  $harness" | sha256sum --check
          git apply --check "$patch"
          git apply "$patch"
          echo "ee0196ac3acb9ec01c828d9a9fd6a2e3a3cb34db681550571dd6e2a985f6473a  $harness" | sha256sum --check
          git apply --reverse "$patch"
          git diff --exit-code -- "$harness"

      - name: Install and build pinned platform validator
        run: |
          pnpm --dir .platform install --frozen-lockfile
          pnpm --dir .platform --filter @vrata/shared-types build
          pnpm --dir .platform --filter @vrata/templates build
          pnpm --dir .platform --filter @vrata/asset-pipeline build

      - name: Validate every scene bundle with pinned platform
        shell: bash
        run: |
          for scene_manifest in assets/scenes/*/*/scene.json; do
            node .platform/packages/asset-pipeline/dist/cli.js scenes validate "$(dirname "$scene_manifest")"
          done
